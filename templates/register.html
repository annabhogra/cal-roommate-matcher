{% extends "base.html" %}
{% block title %}Sign up — Cal Roommate Matcher{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="fw-bold mb-4">Create your account</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Berkeley email</label>
                <input type="email" name="email" class="form-control" placeholder="you@berkeley.edu" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" minlength="8" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Year</label>
                <select name="year" class="form-select" required>
                    <option value="">Select...</option>
                    <option>Freshman</option>
                    <option>Sophomore</option>
                    <option>Junior</option>
                    <option>Senior</option>
                    <option>Grad student</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">Major <span class="text-muted">(optional)</span></label>
                <input type="text" name="major" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>
        <p class="text-center text-muted mt-3 small">Already have an account? <a href="/login">Log in</a></p>
    </div>
</div>

{% endblock %}
